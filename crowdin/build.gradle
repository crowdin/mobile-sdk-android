import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinCompose)
}

apply from: '../jacoco.gradle'

ext {
    // Use centralized version from gradle.properties
    libraryVersionCode = project.property('libraryVersionCode') as Integer
    libraryVersionName = project.property('crowdinVersion')

    publishedGroupId = project.property('publishedGroupId')
    libraryName = 'CrowdinAndroidSdk'
    artifact = 'sdk'

    libraryDescription = "Crowdin Android SDK delivers all new translations from Crowdin project to the application immediately. So there is no need to update this application via Google Play Store to get the new version with the localization."

    siteUrl = project.property('siteUrl')
    gitUrl = project.property('gitUrl')

    libraryVersion = libraryVersionName

    developerId = project.property('developerId')
    developerName = project.property('developerName')
    developerEmail = project.property('developerEmail')

    licenseName = project.property('licenseName')
    licenseUrl = project.property('licenseUrl')
    allLicenses = ["MIT"]
}

android {
    namespace 'com.crowdin.platform'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode libraryVersionCode
        versionName libraryVersionName
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "VERSION_NAME", "\"$versionName\""
        buildConfigField "int", "MIN_COMPOSE_API_LEVEL", "24"
    }

    buildTypes {
        debug {
            minifyEnabled false
            testCoverageEnabled = true
        }

        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.material
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.gson
    implementation libs.okhttp.logging.interceptor
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.multidex

    // Jetpack Compose dependencies — explicit versions, not the BOM: this module is published
    // with a hand-generated POM (see maven.gradle) and BOM-managed versions don't reach it
    implementation libs.androidx.ui
    implementation libs.androidx.ui.text
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.foundation

    testImplementation libs.junit
    testImplementation libs.mockito.core
}

// KtLint configuration
configurations {
    ktlint
}

dependencies {
    ktlint(libs.ktlint.cli)
}

tasks.register("ktlint", JavaExec) {
    group = "verification"
    description = "Check Kotlin code style with ktlint."
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    args = ["format", "src/**/*.kt"] // use 'check' instead of 'format' for lint check only
}

check.dependsOn "ktlint"

tasks.register("ktlintFormat", JavaExec) {
    group = "formatting"
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main") // use `mainClass.set()` instead of `main`
    args = ["-F", "src/**/*.kt"] // `-F` enables formatting
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

apply from: 'maven.gradle'
